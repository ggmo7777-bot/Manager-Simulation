<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager Simulation</title>
<style>
:root{--bg:#F7F6F2;--card:#FFFFFF;--ink:#15171A;--mut:#5B6068;--line:#D9D6CE;--line2:#BFBBB0;--acc:#0B6E99;--accbg:#E7F1F6;--warn:#B45309;--warnbg:#FFF4E5;--hover:#F0EEE8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-size:14px;line-height:1.6}
button,select{font:inherit}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.mut{color:var(--mut)}.hd{font-size:13px;color:var(--mut)}
header{min-height:56px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;padding:6px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header .brand{font-weight:900;font-size:16px}
header .sep{width:1px;height:26px;background:var(--line)}
header .grow{flex:1}
.layout{display:flex;min-height:calc(100vh - 56px)}
nav{flex:none;width:168px;background:var(--card);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;height:44px;padding:0 12px;border:0;border-radius:2px;background:none;color:#3A3F46;font-weight:500;cursor:pointer;text-align:left}
nav button:hover{background:var(--hover);color:var(--ink)}
nav button.on{background:var(--accbg);color:var(--acc);font-weight:700}
nav button:disabled{color:#A5A39A;cursor:not-allowed;background:none}
main{flex:1;min-width:0;padding:18px 24px 40px;display:flex;flex-direction:column;gap:14px;max-width:1200px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:14px 18px}
h2{margin:0 0 8px;font-size:16px;font-weight:900}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:500;color:var(--mut);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-top:1px solid #E6E3DB;vertical-align:middle}
.bt{display:inline-flex;align-items:center;justify-content:center;padding:0 18px;height:44px;border-radius:2px;font-weight:700;border:1px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer}
.bt:hover{background:var(--hover)}.bt.go{background:var(--acc);color:#fff;border-color:var(--acc)}.bt.go:hover{background:#0A5C80}
.bt:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
select{height:44px;border:1px solid var(--line2);border-radius:2px;background:#fff;padding:0 10px}
label.pick{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:2px;background:#fff;cursor:pointer;font-weight:700}
label.pick:has(input:checked){background:var(--acc);border-color:var(--acc);color:#fff}
label.pick .hd{color:inherit;font-weight:400}
label.pick input{width:18px;height:18px}
.bar{position:relative;width:140px;height:10px;background:#EEECE6;border:1px solid var(--line)}
.bar i{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink)}
.bar b{position:absolute;top:2px;height:4px;background:var(--acc);opacity:.35}
.lb{display:inline-block;font-size:12px;font-weight:700;padding:0 6px;margin-right:6px;border:1px solid var(--ink);border-radius:2px;line-height:1.5;white-space:nowrap}
.lb-f{background:var(--ink);color:#fff}.lb-o{background:var(--accbg);color:var(--acc);border-color:var(--acc)}.lb-r{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}.lb-e{background:#fff;color:#3A3F46;border-style:dashed}
.ev{padding:8px 0;border-top:1px solid #E6E3DB}.ev:first-of-type{border-top:0}
.err{color:var(--warn);font-weight:700}
.hide{display:none}
details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--mut)}
.notice{background:var(--warnbg);border:1px solid var(--warn);border-radius:2px;padding:10px 16px}
.hdctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hdctl input{height:44px;border:1px solid var(--line2);border-radius:2px;padding:0 8px;min-width:0}
.hdctl select{max-width:100%}
.scroll{overflow-x:auto}.scroll table{min-width:640px}
@media(max-width:760px){.layout{flex-direction:column}nav{width:auto;flex-direction:row;overflow-x:auto}nav button{flex:none;white-space:nowrap}header .sep,header .grow{display:none}header{padding:8px 16px}.hdctl{width:100%}.hdctl input{flex:1 1 90px}main{padding:14px 16px 40px}.bar{width:90px}}
</style>
</head>
<body>
<header>
  <span class="brand">Manager Simulation</span><span class="hd">club_a の監督(あなた)</span><span class="sep"></span>
  <span class="num" id="clock"></span><span class="mut" id="phaseLabel"></span><span class="grow"></span>
  <span class="hd">コード <b class="num" id="shareCode" title="同じコードを入力すると同じ世界で遊べる"></b></span>
  <div class="hdctl"><label class="hd" for="seed">シード / コード</label><input id="seed" value="7" style="width:130px">
  <button class="bt" id="newGame">最初から</button>
  <input id="saveName" value="save1" style="width:90px" aria-label="セーブ名">
  <button class="bt" id="saveGame">セーブ</button>
  <select id="saveList" aria-label="続きから"><option value="">続きから…</option></select>
  <button class="bt" id="loadGame">続きから</button></div>
</header>
<div class="layout">
  <nav aria-label="画面">
    <button data-tab="squad" class="on">選手</button>
    <button data-tab="match">試合日</button>
    <button data-tab="transfer">移籍</button>
    <button data-tab="table">順位</button>
    <button data-tab="reveal" id="revealTab" disabled>季節の答え合わせ</button>
    <button data-tab="history">クラブ史</button>
  </nav>
  <main>
    <div class="err" id="error" role="alert"></div>
    <div id="notices"></div>
    <div id="squad">
      <section class="card"><h2>選手 <span class="hd">推定と不確かさ。真の値は季節の終わりまで見えない</span></h2><div id="squadTable" class="scroll"></div></section>
    </div>
    <div id="match" class="hide">
      <section class="card" id="actionCard"></section>
      <section class="card"><h2>結果とその理由 <span class="hd">直前の1手分</span></h2><div id="result" class="mut">まだ何も起きていない。</div></section>
      <section class="card"><h2>今季の記録 <span class="hd">週ごとのあなたの一手と、起きたこと(この画面を開いている間の分)</span></h2><div id="seasonLog" class="mut">まだ記録なし。</div></section>
    </div>
    <div id="transfer" class="hide"><div id="transferBody"></div></div>
    <div id="table" class="hide"><section class="card"><h2>順位</h2><div id="standings" class="scroll"></div></section></div>
    <div id="reveal" class="hide"><section class="card"><h2>推定と真実</h2><div id="revealBody" class="scroll"></div></section></div>
    <div id="history" class="hide"><section class="card"><h2>クラブ史 <span class="hd">終わった季ごとの結果・入れ替わり・あなたの推定の的確さ</span></h2><div id="historyBody" class="scroll"></div></section></div>
  </main>
</div>
<script>
const LABEL_CLASS = {"事実":"lb-f","観測":"lb-o","本人の理由":"lb-r","推定":"lb-e"};
const RESPONSE = {complied:"従った", partial:"部分的に従った", refused:"断った"};
const STATED = {trusts_coach:"あなたを信頼している", distrusts_coach:"あなたを信用していない", personal:"個人的な事情"};
const TRUE_REASON = {trust_above_autonomy:"信頼が自立心を上回る", trust_below_autonomy:"信頼が自立心を下回る", self_disciplined:"自分に厳しい性格", self_lax:"自分に甘い性格", irritated_by_low_playing_time:"出場機会の少なさへの苛立ち", no_dominant_term:"決め手なし"};
const OFFER_BLOCK = {roster_full:"選手数が上限(4人)のため成立しない", insufficient_cash:"資金が足りない(手数料+予備)", circular_transfer:"過去に在籍した選手は取れない", same_club:"同じクラブ", accepted:"条件はルール上通った"};
const TRANSFER_STATED = {accepts:"申し出を受ける", not_looking:"いまは移籍を考えていない", terms_unattractive:"条件に魅力を感じない", chose_other_club:"他クラブの話を選んだ"};
const TRANSFER_HINT = {not_looking:"出場機会に不満が出るまで待つ手もある(推定)", terms_unattractive:"次の窓で出し直せる。条件は本人の採点で決まる", chose_other_club:"他クラブと競った。次の窓で出し直せる"};
const benchNote = n => n ? `ベンチ${n}連続${n >= 4 ? "以上" : ""}` : "ベンチ連続なし";
const lastBid = r => r.asked ? `${r.day ? `通算日${r.day}` : ""}に${TRANSFER_RESPONSE[r.last_response]}${r.last_stated_reason && r.last_response === "declined" ? `「${TRANSFER_STATED[r.last_stated_reason]}」` : ""}` : "申し出の履歴なし";
const TRANSFER_RESPONSE = {accepted:"受けた", declined:"断った", blocked:"不成立"};
const SOLD_STATED = {wants_move:"ほかのクラブでプレーしたい"};
const RETIRE_REASON = {age_limit:"年齢の限界", veteran_low_playing_time:"出場機会の少なさ(ベテラン)"};
const $ = id => document.getElementById(id);
let state = null, lastResult = null, names = {};
const OWN = "club_a";
const nm = pid => names[pid] || pid;
const who = pid => `${esc(nm(pid))}<span class="hd"> ${esc(pid)}</span>`;
const plan = {scout: null, offers: new Set(), requeue: new Set()};  // chosen on the transfer tab, sent with the next training week / match day
const seasonLog = [];  // one row per step the player took this season, built from the step results (not saved with the game)
const mil = units => (units / 1e6).toFixed(2);

function esc(value) { const d = document.createElement("div"); d.textContent = String(value); return d.innerHTML; }
const f2 = v => Number(v).toFixed(2), f3 = v => Number(v).toFixed(3);
const chip = label => `<span class="lb ${LABEL_CLASS[label]}">${label}</span>`;

async function api(path, body) {
  const options = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error);
  return data;
}
async function act(path, body) {
  $("error").textContent = "";
  try { return await api(path, body); } catch (e) { $("error").textContent = e.message; return null; }
}

function describe(e) {
  switch (e.kind) {
    case "league_match_completed": {
      const own = e.home_club === "club_a" ? e.home_starters : e.away_starters;
      const goals = own.map(p => `${nm(p)} ${e.player_stats[p].goals}得点/シュート${e.player_stats[p].shots}`).join("、");
      return `${e.home_club} ${e.home_goals} - ${e.away_goals} ${e.away_club}(シュート ${e.home_shots}-${e.away_shots})。あなたの先発: ${goals}`;
    }
    case "season_retired": return `${nm(e.player_id)}(${e.age}歳)が引退。本人の理由: ${RETIRE_REASON[e.reason] || e.reason}`;
    case "season_youth_joined": return `新人 ${nm(e.player_id)}(${e.age}歳)が入団。あなたはまだ何も知らない`;
    case "lineup_decision": return `あなたの先発 ${e.starters.map(nm).join("・")} / 控え ${e.bench.map(nm).join("・") || "なし"}`;
    case "advice_given": return `助言 ${nm(e.player_id)} に練習法${e.method}(あなたの予測する伸び ${f3(e.forecast)})`;
    case "transfer_completed": return `${nm(e.player_id)} が ${e.from_club} から ${e.to_club} へ移籍`;
    case "coach_advice_outcome": return `${nm(e.player_id)} は練習法${e.method}の助言に${RESPONSE[e.response]}。本人の弁: 「${STATED[e.stated_reason]}」${e.response === "refused" && e.stated_reason === "distrusts_coach" ? "(あなたへの信頼が下がっているのかもしれない。真の原因は季の答え合わせで)" : ""}`;
    case "player_sold": return `${nm(e.player_id)} が ${e.to_club} へ移籍した。本人の申し出で、あなたの同意を取らずに成立した。本人の弁: 「${SOLD_STATED[e.stated_reason]}」`;
    case "coach_session_observation": return `${nm(e.player_id)} の練習(${e.action})を見た: 技能の読み ${f3(e.obs_skill)} / 伸び ${f3(e.obs_gain)} / 疲労の読み ${f3(e.obs_fatigue)}`;
    case "coach_match_observation": return `${nm(e.player_id)} の試合評価の読み ${f3(e.rating_obs)} / 疲労の読み ${f3(e.obs_fatigue)}`;
    case "offer_resolved": return `${nm(e.player_id)} への申し出: ${e.accepted ? "ルール上は通り、本人の返答待ち" : OFFER_BLOCK[e.reason] || e.reason}`;
    case "transfer_response":
      return e.response === "blocked" ? `${nm(e.player_id)}: 現所属クラブが放出に同意せず、不成立`
        : `${nm(e.player_id)} は申し出を${TRANSFER_RESPONSE[e.response]}。本人の弁: 「${TRANSFER_STATED[e.stated_reason]}」${TRANSFER_HINT[e.stated_reason] ? `。${TRANSFER_HINT[e.stated_reason]}` : ""}`;
    case "coach_scout_observation": return `他クラブの ${nm(e.player_id)} を偵察: 技能の読み ${f3(e.obs_skill)}`;
    default: return e.kind;
  }
}

function bar(estimate, error) {
  const lo = Math.max(0, estimate - error) * 100, hi = Math.min(1, estimate + error) * 100;
  return `<div class="bar" title="推定 ${f3(estimate)} ± ${f3(error)}"><b style="left:${lo}%;width:${hi - lo}%"></b><i style="left:${estimate * 100}%"></i></div>`;
}

const LOW_TRUST = 0.4, HIGH_TRUST = 0.66, WIDE_SD = 0.2;  // wording thresholds for the coach's own estimate only
function trustText(p) {
  const r = p.receptiveness, record = p.advice_record;
  if (!r) return "不明(まだ助言の結果を見ていない)";
  const level = r.mean >= HIGH_TRUST ? "高め" : r.mean <= LOW_TRUST ? "低め" : "中ぐらい";
  const sure = r.sd >= WIDE_SD ? "。まだ幅が広い" : "";
  const refused = record.asked ? `。断られた ${record.refused}/${record.asked}回${record.last_stated_reason ? `・直近の本人の弁「${STATED[record.last_stated_reason]}」` : ""}` : "";
  return `${level}(推定 ${f2(r.mean)} ±${f2(r.sd)}・${r.outcomes}回の結果から${sure})${refused}`;
}

// The player whose reaction to advice the coach can read least: no outcome seen yet, else the widest estimate (a suggestion only; "助言しない" stays one click away).
function leastKnownResponder() {
  const spread = p => p.receptiveness ? p.receptiveness.sd : Infinity;
  return state.squad.reduce((best, p) => spread(p) > spread(best) ? p : best).player_id;
}

function renderSquad() {
  const rows = state.squad.map(p => {
    const rec = trustText(p);
    return `<tr><td class="num">${esc(nm(p.player_id))}<div class="hd">${esc(p.player_id)} · ${p.age}歳${p.observation_count === 0 ? " 新人・未観察" : ""}</div></td>
      <td>${bar(p.skill_estimate, p.measurement_error)}<span class="num">${f2(p.skill_estimate)}</span> <span class="hd">±${f3(p.measurement_error)}/回</span></td>
      <td><span class="num">${f2(p.rating_estimate)}</span></td>
      <td><span class="num">${f2(p.fatigue_estimate)}</span></td>
      <td>${p.observation_count}回 / 最後に見て${p.days_unseen}日</td>
      <td>${esc(rec)}</td><td>${p.appearances}試合 ${p.goals}得点</td></tr>`;
  }).join("");
  $("squadTable").innerHTML = `<table><tr><th>選手</th><th>技能の推定</th><th>試合評価</th><th>疲労の推定</th><th>観測の量</th><th>助言を聞く度合い(推定)</th><th>出場(事実)</th></tr>${rows}</table>
    <div class="hd" style="margin-top:8px">±は1回の観測の誤差幅。観測が少ない・古い選手ほど、実際の推定誤差は大きい。</div>`;
}

// Why a bid cannot be made right now (null when it can). Cash rule: the research market asks fee + reserve per bid.
function offerBlock(playerId, canOffer, offering) {
  const {market, phase} = state;
  if (offering) return null;
  if (!canOffer) return phase !== "lineup" ? "試合日のみ" : "いまは窓がない";
  const shortfall = offerNeed(plan.offers.size + 1) - market.cash;
  return shortfall > 0 ? `資金不足(あと${mil(shortfall)})` : null;
}
const offerNeed = count => count * state.market.offer_fee + state.market.reserve;

// A declined player queued for the next window joins this match day's offers when the window is open and cash allows; the player can still untoggle.
function moveQueuedIntoOffers(canOffer) {
  if (!canOffer) return;
  for (const id of [...plan.requeue]) {
    if (offerBlock(id, canOffer, false)) continue;
    plan.offers.add(id); plan.requeue.delete(id);
  }
}

const wasDeclined = t => t.bid_record.last_response === "declined";
function queueButton(t, canOffer, offering) {
  if (!wasDeclined(t) || offering) return "";
  const queued = plan.requeue.has(t.player_id);
  const waiting = queued && canOffer ? '<div class="hd err">資金が戻れば自動で入る</div>' : "";
  return `<button class="bt ${queued ? "go" : ""}" data-requeue="${esc(t.player_id)}" aria-pressed="${queued}" style="margin-top:4px;padding:0 10px">${queued ? "予約済み(次の窓)" : "次の窓で出し直す"}</button>${waiting}`;
}

function renderTransfer() {
  const {market, targets, phase} = state, window_ = market.window;
  const canOffer = phase === "lineup" && window_ && window_.open_now, canScout = phase === "training";
  moveQueuedIntoOffers(canOffer);
  const banner = window_ ? `次の移籍窓: 第${window_.season}季 日${window_.day}${canOffer ? "。次の試合日のあとに処理される。申し出は今ここで決める" : ""}${window_.open_now ? `。いまの資金 ${mil(market.cash)} / 申し出1件に必要 ${mil(offerNeed(1))}` : ""}` : "移籍窓はもうない(研究側の窓は2回だけ)";
  const rows = targets.map(t => {
    const scouting = plan.scout === t.player_id, offering = plan.offers.has(t.player_id);
    const noOffer = offerBlock(t.player_id, canOffer, offering);
    return `<tr><td class="num">${esc(nm(t.player_id))}<div class="hd">${esc(t.player_id)} · ${esc(t.club_id)}</div></td><td class="num">${t.age}</td>
      <td>${t.observation_count ? bar(t.skill_estimate, t.measurement_error) + `<span class="num">${f2(t.skill_estimate)}</span> <span class="hd">±${f3(t.measurement_error)}/回</span>` : '<span class="mut">未観察(推定は定数0.50)</span>'}</td>
      <td>${t.observation_count}回<div class="hd">${t.observation_count ? `最後に見て${t.days_unseen}日` : "一度も見ていない"}</div></td>
      <td>${t.appearances}試合 ${t.goals}得点<div class="hd">${chip("観測")} ${esc(benchNote(t.bench_streak))}</div><div class="hd">${t.bid_record.asked ? chip("本人の理由") : ""} ${esc(lastBid(t.bid_record))}</div></td>
      <td><button class="bt ${scouting ? "go" : ""}" data-scout="${esc(t.player_id)}" aria-pressed="${scouting}" ${canScout && t.scoutable ? "" : "disabled"}>${scouting ? "偵察中" : "偵察"}</button></td>
      <td><button class="bt ${offering ? "go" : ""}" data-offer="${esc(t.player_id)}" aria-pressed="${offering}" ${noOffer ? "disabled" : ""}>${offering ? "申し出る" : "見送り"}</button>${noOffer ? `<div class="hd err">${esc(noOffer)}</div>` : ""}${queueButton(t, canOffer, offering)}${state.recommended_offers.includes(t.player_id) ? '<div class="hd">副コーチ推奨</div>' : ""}</td></tr>`;
  }).join("");
  const offers = [...plan.offers];
  const cashGap = offerNeed(Math.max(offers.length, 1)) - market.cash;  // positive: short of cash
  const results = lastResult ? lastResult.events.filter(e => ["offer_resolved", "transfer_response", "player_sold"].includes(e.kind) || (e.kind === "transfer_completed" && e.from_club !== OWN)) : [];
  $("transferBody").innerHTML = `<section class="card"><h2>他クラブの選手 <span class="hd">見えるのは自分の観測から作った推定と公開記録だけ。移籍の気配は公開の出場記録と過去の返答だけで、本人の意思そのものは見えない</span></h2>
    <div class="ev" style="border:0;padding-top:0"><b>${esc(banner)}</b></div>
    <div class="scroll"><table><tr><th>選手</th><th>年齢</th><th>技能の推定</th><th>観測</th><th>公開記録と移籍の気配</th><th>偵察</th><th>申し出</th></tr>${rows}</table></div>
    <div class="hd" style="margin-top:8px">±は1回の観測の誤差幅(確率ではない)。観測が少ない・古い選手ほど当てにならない。偵察は練習の週の最初の日に1人まで。</div></section>
  <section class="card"><h2>予算と今回の指示</h2>
    <table><tr><td>いまの資金</td><td class="num">${mil(market.cash)}</td></tr>
    <tr><td>偵察1回(資金の${mil(market.reserve)}を残して実行)</td><td class="num">${mil(market.scout_cost)}</td></tr>
    <tr><td>申し出1件に必要(手数料${mil(market.offer_fee)} + 予備${mil(market.reserve)})</td><td class="num">${mil(offerNeed(1))}</td></tr>
    <tr><td>いまの申し出${offers.length}件に必要(手数料${offers.length}件分 + 予備)</td><td class="num">${offers.length ? mil(offerNeed(offers.length)) : "-"}</td></tr>
    <tr class="${cashGap > 0 ? "err" : ""}"><td>${cashGap > 0 ? "不足" : "申し出1件の後に残る資金"}</td><td class="num">${mil(Math.abs(cashGap))}</td></tr>
    <tr><td>選手数(${market.roster_min}〜${market.roster_max}人)</td><td class="num">${market.roster_size}</td></tr></table>
    <div class="hd" style="margin:6px 0">窓の処理中は先に自クラブの選手が売れて資金が増えることがある。成立の判定は窓の処理の中で、ルールが行う。</div>
    <div>偵察: <b>${esc(plan.scout ? nm(plan.scout) : "なし")}</b>(「試合日」の「1週間練習する」と一緒に実行)</div>
    <div>次の窓の予約: <b>${plan.requeue.size ? esc([...plan.requeue].map(nm).join("・")) : "なし"}</b>(断られた選手。窓が開く試合日に申し出へ自動で入る。外せる)</div>
    <div>申し出: <b>${offers.length ? esc(offers.map(nm).join("・")) : "出さない"}</b>(「試合をする」と一緒に出る。選手が自分で受けるか断るかを決める)</div>
    <div class="row" style="margin-top:8px"><button class="bt go" id="toMatch">試合日へ</button></div></section>
  ${results.length ? `<section class="card"><h2>窓の結果</h2>${results.map(e => `<div class="ev">${chip(e.label)}<span class="mut">通算日${e.day}</span> ${esc(describe(e))}</div>`).join("")}
    <div class="hd" style="margin-top:6px">本人の述べた理由は本心の一部。本当の原因は季節の答え合わせで見られる。</div></section>` : ""}`;
  document.querySelectorAll("[data-scout]").forEach(b => b.onclick = () => { plan.scout = plan.scout === b.dataset.scout ? null : b.dataset.scout; if ($("scoutTarget")) $("scoutTarget").value = plan.scout || ""; renderTransfer(); });
  document.querySelectorAll("[data-offer]").forEach(b => b.onclick = () => {
    plan.offers.has(b.dataset.offer) ? plan.offers.delete(b.dataset.offer) : plan.offers.add(b.dataset.offer); renderTransfer(); });
  document.querySelectorAll("[data-requeue]").forEach(b => b.onclick = () => {
    plan.requeue.has(b.dataset.requeue) ? plan.requeue.delete(b.dataset.requeue) : plan.requeue.add(b.dataset.requeue); renderTransfer(); });
  $("toMatch").onclick = () => show("match");
}

function renderStandings() {
  const rows = state.standings.map((r, i) => `<tr><td class="num">${i + 1}</td><td>${esc(r.club_id)}${r.club_id === state.club_id ? " (あなた)" : ""}</td>
    <td class="num">${r.points}</td><td>${r.wins}勝${r.draws}分${r.losses}敗</td><td class="num">${r.goals_for}-${r.goals_against}</td><td>${r.played}</td></tr>`).join("");
  $("standings").innerHTML = `<table><tr><th>#</th><th>クラブ</th><th>勝点</th><th>成績</th><th>得失点</th><th>試合</th></tr>${rows}</table>`;
}

function renderAction() {
  const roster = state.squad.map(p => p.player_id);
  if (state.phase === "training") {
    const suggested = leastKnownResponder();
    const players = roster.map(p => `<option value="${esc(p)}" ${p === suggested ? "selected" : ""}>${esc(nm(p))}${p === suggested ? "(推奨)" : ""}</option>`).join("");
    const scoutOptions = state.targets.filter(t => t.scoutable).map(t =>
      `<option value="${esc(t.player_id)}" ${plan.scout === t.player_id ? "selected" : ""}>${esc(nm(t.player_id))}(${esc(t.club_id)}・${t.observation_count ? `観察${t.observation_count}回` : "未観察"})</option>`).join("");
    $("actionCard").innerHTML = `<h2>第${state.week}週 練習 <span class="hd">助言は入力であって命令ではない。従うかは本人が決める</span></h2>
      <div class="row"><label>助言する選手 <select id="advPlayer"><option value="">助言しない</option>${players}</select></label>
      <label>練習法 <select id="advMethod">${state.methods.map(m => `<option>${m}</option>`).join("")}</select></label>
      <label>偵察する他クラブの選手 <select id="scoutTarget"><option value="">偵察しない</option>${scoutOptions}</select></label>
      <button class="bt go" id="doTrain">1週間練習する</button></div>
      <div id="advHint" class="hd" style="margin-top:6px"></div>
      <div class="hd" style="margin-top:6px">助言は週の最初の日に1人へ。偵察は週の最初の日に他クラブの選手1人まで(資金が足りないと選べない。「移籍」タブでも同じ選択ができる)。残りの枠は副コーチ(自動)が決める。</div>`;
    $("scoutTarget").onchange = () => { plan.scout = $("scoutTarget").value || null; renderTransfer(); };
    const showAdvHint = () => {
      const row = state.squad.find(p => p.player_id === $("advPlayer").value);
      $("advHint").innerHTML = row ? `${esc(nm(row.player_id))}が助言を聞く度合い(推定): <b>${esc(trustText(row))}</b>` : "";
    };
    $("advPlayer").onchange = showAdvHint;
    showAdvHint();
    $("doTrain").onclick = async () => {
      const player_id = $("advPlayer").value;
      const label = `第${state.week}週 練習`;
      lastResult = await act("/api/train", {advice: player_id ? {player_id, method: $("advMethod").value} : null, scout: plan.scout});
      if (lastResult) { plan.scout = null; logStep(label, lastResult); }
      refresh();
    };
  } else if (state.phase === "lineup") {
    const boxes = roster.map(p => `<label class="pick"><input type="checkbox" name="starter" value="${esc(p)}" ${state.recommended_starters.includes(p) ? "checked" : ""}>${esc(nm(p))}${state.recommended_starters.includes(p) ? '<span class="hd">推奨</span>' : ""}</label>`).join("");
    $("actionCard").innerHTML = `<h2>第${state.week}節 先発を選ぶ <span class="hd">2人。副コーチの推奨(あなたの推定による)は初期選択</span></h2>
      <div class="row">${boxes}<button class="bt go" id="doMatch">試合をする</button></div>
      <div class="hd" style="margin-top:6px">${state.market.window && state.market.window.open_now ? `この試合のあとに移籍窓。申し出は「移籍」タブで選ぶ(いま: ${esc([...plan.offers].map(nm).join("・") || "出さない")})。自クラブの選手が移籍を申し出ることもあり、その場合はあなたの同意なしに成立する(起きたらお知らせと本人の弁が出る)。` : "この試合のあとに移籍窓はない。"}</div>`;
    $("doMatch").onclick = async () => {
      const starters = [...document.querySelectorAll("input[name=starter]:checked")].map(i => i.value);
      const label = `第${state.week}節 試合`;
      lastResult = await act("/api/lineup", {starters, offers: [...plan.offers]});
      if (lastResult) { plan.offers.clear(); logStep(label, lastResult); }
      refresh();
    };
  } else {
    $("actionCard").innerHTML = `<h2>第${state.season}季 終了</h2><div class="row"><span>「季節の答え合わせ」で、あなたの推定と真実を比べられる。</span>
      <button class="bt go" id="doNextSeason">次の季へ</button></div>
      <div class="hd" style="margin-top:6px">選手は1つ年を取り、引退者は新人に入れ替わる。推定はそのまま持ち越す(古くなる)。新人は未観察から始まる。</div>`;
    $("doNextSeason").onclick = async () => {
      const next = await act("/api/next_season", {});
      if (!next) return;
      resetSeasonLog(); lastResult = null; $("result").textContent = `第${next.state.season}季が始まった。`; $("result").className = "mut";
      refresh(next.state); show("match");
    };
  }
}

const eventLine = e => `<div class="ev">${chip(e.label)}<span class="mut">通算日${e.day}</span> ${esc(describe(e))}</div>`;
const hidden = e => e.kind === "transfer_completed" && e.from_club === OWN;  // shown as the sale notice instead
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));

// What the player's own input did, beside what the assistant coach recommended.
function yourMoveLines(result) {
  const move = result.your_move, lines = [];
  if (move.kind === "lineup") {
    const outs = move.recommended_starters.filter(p => !move.starters.includes(p)), ins = move.starters.filter(p => !move.recommended_starters.includes(p));
    const match = result.your_events.find(e => e.kind === "league_match_completed");
    const own = match && (match.home_club === OWN ? match.home_starters : match.away_starters);
    const stat = pid => own && own.includes(pid) ? `${nm(pid)}は${match.player_stats[pid].goals}得点/シュート${match.player_stats[pid].shots}` : "";
    lines.push(`先発 ${move.starters.map(nm).join("・")}: ` + (outs.length === 0
      ? "副コーチの推奨と同じ。あなたの選択で変わったことはない"
      : `副コーチの推奨(${move.recommended_starters.map(nm).join("・")})と違う。${ins.map(nm).join("・")}を入れ、${outs.map(nm).join("・")}を外した。入れた側の結果: ${ins.map(stat).join("、")}。推奨どおりだった場合の結果は分からない`));
    if (move.offers.length || move.recommended_offers.length)
      lines.push(`申し出 ${move.offers.map(nm).join("・") || "なし"}: ` + (sameSet(move.offers, move.recommended_offers) ? "副コーチの推奨と同じ" : `副コーチの推奨は ${move.recommended_offers.map(nm).join("・") || "なし"}`));
  } else if (move.kind === "train") {
    lines.push(move.advice ? `助言 ${nm(move.advice.player_id)} に練習法${move.advice.method}` : "助言しなかった");
    lines.push(move.scout ? `偵察 ${nm(move.scout)}` : "偵察しなかった");
  }
  return lines;
}

const LOGGED_KINDS = ["coach_advice_outcome", "coach_scout_observation", "league_match_completed", "player_sold"];
function logStep(label, result) {
  const lines = result.your_events.filter(e => LOGGED_KINDS.includes(e.kind)).map(e => `${chip(e.label)}${esc(describe(e))}`);
  if (result.your_move.kind === "train" && !result.your_move.advice) lines.unshift("助言しなかった");
  seasonLog.push({label, lines});
  renderSeasonLog();
}
function resetSeasonLog() { seasonLog.length = 0; renderSeasonLog(); }
function renderSeasonLog() {
  $("seasonLog").className = seasonLog.length ? "" : "mut";
  $("seasonLog").innerHTML = seasonLog.length ? `<table>${seasonLog.map(r => `<tr><td class="num" style="white-space:nowrap">${esc(r.label)}</td><td>${r.lines.map(l => `<div>${l}</div>`).join("")}</td></tr>`).join("")}</table>` : "まだ記録なし。";
}

function renderResult() {
  if (!lastResult) return;
  const yours = lastResult.your_events.filter(e => !hidden(e)), auto = lastResult.auto_events.filter(e => !hidden(e));
  const sold = lastResult.events.filter(e => e.kind === "player_sold");
  const changes = lastResult.estimate_changes.map(c => `<div class="ev">${chip(c.label)}${esc(nm(c.player_id))} 技能の推定 ${f3(c.skill_before)} → ${f3(c.skill_after)} / 疲労の推定 ${f3(c.fatigue_before)} → ${f3(c.fatigue_after)}</div>`).join("");
  $("result").className = "";
  $("result").innerHTML = `<h3 style="margin:0 0 4px">あなたの一手</h3>
    ${yourMoveLines(lastResult).map(l => `<div class="ev">${esc(l)}</div>`).join("")}
    ${yours.map(eventLine).join("") || '<div class="mut">この一手で直接起きた出来事なし</div>'}
    ${sold.length ? `<h3 style="margin:12px 0 4px">あなたが決めなかったこと</h3>${sold.map(eventLine).join("")}` : ""}
    <details style="margin-top:8px"><summary>自動で起きたこと(${auto.length - sold.length}件・推定の変化を含む)</summary>
      ${auto.filter(e => e.kind !== "player_sold").map(eventLine).join("") || '<div class="mut">なし</div>'}
      <div class="hd" style="margin-top:8px">この1手で推定がどう動いたか</div>${changes}</details>`;
}

function renderNotices() {
  $("notices").innerHTML = state.notices.length ? `<section class="notice"><b>お知らせ(この季)</b>${state.notices.map(n =>
    `<div class="ev">${chip(n.label)}<span class="mut">通算日${n.day}</span> ${esc(describe(n))}</div>`).join("")}</section>` : "";
}

async function renderReveal(season) {
  const data = await act(season ? `/api/reveal/${season}` : "/api/reveal");
  if (!data) return;
  const diff = (a, b) => (a - b >= 0 ? "+" : "") + f3(a - b);
  const players = data.players.map(p => `<tr><td class="num">${esc(nm(p.player_id))}<div class="hd">${esc(p.player_id)} · ${p.age}歳</div></td>
    <td class="num">${f3(p.skill_estimate)}</td><td class="num">${f3(p.skill_true)}</td><td class="num">${diff(p.skill_estimate, p.skill_true)}</td>
    <td class="num">${f3(p.fatigue_estimate)}</td><td class="num">${f3(p.fatigue_true)}</td><td class="num">${f3(p.cap_true)}</td>
    <td class="num">${p.trust_in_you_true === null ? "-" : f2(p.trust_in_you_true)}</td><td class="num">${p.discipline_true === null ? "-" : f2(p.discipline_true)}</td><td class="num">${p.emotional_stability_true === null ? "-" : f2(p.emotional_stability_true)}</td></tr>`).join("");
  const reasons = data.advice_reasons.map(r => `<tr><td class="num">日${r.day}</td><td>${esc(nm(r.player_id))}</td><td>${RESPONSE[r.response]}</td>
    <td>${chip("本人の理由")}${STATED[r.stated_reason]}</td><td>${TRUE_REASON[r.true_reason] || esc(r.true_reason)}</td></tr>`).join("");
  const moves = (data.transfer_reasons || []).map(r => `<tr><td class="num">日${r.day}</td><td>${esc(nm(r.player_id))}</td><td>${TRANSFER_RESPONSE[r.response]}</td>
    <td>${r.stated_reason ? chip("本人の理由") + TRANSFER_STATED[r.stated_reason] : "(本人の弁なし: 現所属が放出に同意せず)"}</td>
    <td>移籍の意思${r.true_cause.wants_transfer ? "あり" : "なし"}(点${f3(r.true_cause.request_score)}) / 放出${r.true_cause.release_consented ? "同意" : "不同意"} / 条件の点${r.true_cause.acceptance_score === null ? "-" : f3(r.true_cause.acceptance_score)}</td></tr>`).join("");
  const sales = (data.sale_reasons || []).map(r => `<tr><td class="num">日${r.day}</td><td>${esc(nm(r.player_id))}</td><td>${esc(r.to_club)}へ</td>
    <td>${chip("本人の理由")}${SOLD_STATED[r.stated_reason]}</td><td>移籍の意思の点${f3(r.true_cause.request_score)} / 控えの序列${r.true_cause.player_rank_in_from}番目</td></tr>`).join("");
  $("revealBody").innerHTML = `<h2>第${data.season}季の答え合わせ</h2><table><tr><th>選手</th><th>技能 推定</th><th>真の技能</th><th>誤差</th><th>疲労 推定</th><th>真の疲労</th><th>成長の上限</th><th>あなたへの信頼</th><th>規律性</th><th>感情安定性</th></tr>${players}</table>
    <h2 style="margin-top:16px">助言への反応: 本人が言った理由と、実際の主因</h2>
    <table><tr><th>日</th><th>選手</th><th>反応</th><th>本人が述べた理由</th><th>実際の主因</th></tr>${reasons || '<tr><td colspan="5" class="mut">助言への反応の記録なし</td></tr>'}</table>
    <h2 style="margin-top:16px">移籍の申し出: 本人が言った理由と、記録に残る実際の判断</h2>
    <table><tr><th>日</th><th>選手</th><th>返答</th><th>本人が述べた理由</th><th>実際の判断(記録)</th></tr>${moves || '<tr><td colspan="5" class="mut">この季に出した申し出なし</td></tr>'}</table>
    <h2 style="margin-top:16px">自クラブの選手の売却: 本人が言った理由と、記録に残る実際の判断</h2>
    <table><tr><th>日</th><th>選手</th><th>移籍先</th><th>本人が述べた理由</th><th>実際の判断(記録)</th></tr>${sales || '<tr><td colspan="5" class="mut">この季に売却なし</td></tr>'}</table>`;
}

function renderHistory() {
  const rows = state.history.map(h => {
    const retired = h.retired.map(r => `${esc(nm(r.player_id))}(${r.age}歳・${RETIRE_REASON[r.reason] || esc(r.reason)})`).join("、") || "なし";
    const joined = h.joined.map(j => esc(nm(j.player_id))).join("、") || "なし";
    return `<tr><td class="num">第${h.season}季</td><td class="num">${h.rank}位 ${h.points}点</td><td>${h.wins}勝${h.draws}分${h.losses}敗 ${h.goals_for}-${h.goals_against}</td>
      <td>${esc(h.champion)}</td><td>${retired}</td><td>${joined}</td><td class="num">${f3(h.skill_mae)}</td><td><button class="bt" data-reveal="${h.season}">答え合わせ</button></td></tr>`;
  }).join("");
  $("historyBody").innerHTML = state.history.length ? `<table><tr><th>季</th><th>順位</th><th>成績</th><th>優勝</th><th>引退</th><th>入団</th><th>技能の推定誤差(平均)</th><th></th></tr>${rows}</table>
    <div class="hd" style="margin-top:8px">推定誤差は、その季の終わりの技能の推定と真の技能の差の平均。小さいほど読めていた。</div>` : '<span class="mut">まだ終わった季がない。</span>';
  document.querySelectorAll("[data-reveal]").forEach(b => b.onclick = () => show("reveal", Number(b.dataset.reveal)));
}

function show(tab, season) {
  for (const id of ["squad", "match", "transfer", "table", "reveal", "history"]) $(id).classList.toggle("hide", id !== tab);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (tab === "reveal") renderReveal(season);
}

function refresh(newState) {
  if (lastResult) state = lastResult.state;
  if (newState) state = newState;
  names = state.names;
  const done = state.phase === "season_end";
  $("clock").textContent = `第${state.season}季 第${Math.min(state.week, 6)}週 日${state.day}/${state.season_days}`;
  $("phaseLabel").textContent = {training: "練習の週", lineup: "先発を決める", season_end: "季節終了"}[state.phase];
  $("shareCode").textContent = state.share_code;
  $("revealTab").disabled = !done;
  renderNotices(); renderSquad(); renderTransfer(); renderStandings(); renderAction(); renderResult(); renderHistory();
  if (done) show("reveal"); else if (!$("squad").classList.contains("hide") && lastResult) show("match");
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.tab));
$("newGame").onclick = async () => {
  const typed = $("seed").value.trim();
  const next = await act("/api/new", /^-?\d+$/.test(typed) ? {seed: Number(typed)} : {code: typed});
  if (!next) return;
  plan.scout = null; plan.offers.clear(); plan.requeue.clear(); resetSeasonLog();
  lastResult = null; $("result").textContent = "まだ何も起きていない。"; $("result").className = "mut";
  refresh(next); show("match");
};
async function refreshSaves() {
  const data = await act("/api/saves");
  if (!data) return;
  $("saveList").innerHTML = `<option value="">続きから…</option>` + data.saves.map(s =>
    `<option value="${esc(s.name)}">${esc(s.name)}${s.steps === null ? "(壊れている)" : `(シード${s.seed}・第${s.season}季・${s.steps}手)`}</option>`).join("");
}
$("saveGame").onclick = async () => {
  const done = await act("/api/save", {name: $("saveName").value});
  if (done) { $("error").textContent = ""; $("result").textContent = `「${done.saved}」にセーブした(日${done.day})。`; $("result").className = "mut"; refreshSaves(); }
};
$("loadGame").onclick = async () => {
  const name = $("saveList").value;
  if (!name) return;
  const next = await act("/api/load", {name});
  if (!next) return;
  plan.scout = null; plan.offers.clear(); plan.requeue.clear(); resetSeasonLog();
  lastResult = null; $("result").textContent = `「${name}」から再開した。`; $("result").className = "mut";
  $("seed").value = next.seed; $("saveName").value = name;
  refresh(next); show("match");
};
refreshSaves();
(async () => { const first = await act("/api/state"); if (first) { refresh(first); show("match"); } })();
</script>
</body>
</html>
